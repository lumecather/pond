# Runs the tests on every push and builds Pond.exe on Windows.
# A tag like v0.1.0 also publishes the zip as a GitHub Release.
name: build

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m PyInstaller --noconfirm --clean pond.spec
      - run: Compress-Archive -Path dist/Pond -DestinationPath Pond-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pond-windows
          path: Pond-windows.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Pond-windows.zip
          generate_release_notes: true
